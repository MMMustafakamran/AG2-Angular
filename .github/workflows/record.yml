name: Record demos

# The expensive one: bring up all three processes, drive every demo route in a
# real browser, and upload the clips.
#
# Manual by default. It spends model tokens on every page, takes ~20 minutes,
# and its output is video — none of which belongs on a per-push trigger. The
# nightly schedule is commented out rather than deleted so turning it on is one
# uncomment, once someone decides the token spend is worth it.
#
# ── Requires a secret ──────────────────────────────────────────────────────
# OPENAI_API_KEY. Without it the backend refuses to start (_build_config raises
# rather than constructing an agent that would fail on first use), and the run
# stops at the preflight step with that said plainly instead of recording
# eleven videos of a dead chat.
#
# ── What "pass" means here ─────────────────────────────────────────────────
# Not "the features work". project-context.md: a clean run that finds nothing
# when the docs are broken is a FAILED run. Eight of these eleven pages are
# recorded to demonstrate a defect, and each writes its finding on screen. A
# green run means every clip captured what it was supposed to capture —
# including the empty A2UI surface, the dropped state write, and the interrupt
# panels that never fire.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Page ids, comma-separated (blank = all 11). e.g. shared-state,a2ui'
        type: string
        required: false
      online_doctor:
        description: 'Probe every doc/demo URL and selector before recording'
        type: boolean
        default: true
  # Nightly. Uncomment to enable — see the note at the top about token spend.
  # schedule:
  #   - cron: '47 5 * * *'

permissions:
  contents: read

jobs:
  record:
    name: Drive the demos and capture them
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Matches the ports in frontend/server.ts, backend/main.py and
      # autorecorder/config/project.config.ts. Set here too so a change in one
      # place fails loudly at the health check rather than quietly at record time.
      BACKEND_URL: http://localhost:8400
      RUNTIME_URL: http://localhost:8401/api/copilotkit/info
      FRONTEND_URL: http://localhost:4204

    steps:
      - uses: actions/checkout@v4

      # Checked, never echoed. A secret stored with a stray newline defeats
      # GitHub's log masking — the mask matches the stored value, so a form of
      # the key WITHOUT the newline (which is what an error message prints)
      # sails straight through and lands in a public log. That happened on run
      # 33477092124 and cost a key rotation, so the shape of the value is
      # validated here, before anything can construct a request from it.
      - name: Require a well-formed model key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is not set for this repository."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "The AG2 backend talks to OpenAI directly and will not start without it."
            exit 1
          fi

          # Length and character class only. Nothing below prints any part of
          # the value, not even a prefix.
          raw_len=${#OPENAI_API_KEY}
          trimmed=$(printf '%s' "$OPENAI_API_KEY" | tr -d '[:space:]')
          trimmed_len=${#trimmed}

          if [ "$raw_len" -ne "$trimmed_len" ]; then
            echo "::error::OPENAI_API_KEY contains whitespace ($((raw_len - trimmed_len)) character(s))."
            echo "A trailing newline makes the Authorization header illegal, so every"
            echo "model call fails, the AG-UI stream dies, and the Copilot Runtime goes"
            echo "with it - every page then reports 'Failed to fetch'."
            echo "It also breaks log masking. Re-add the secret as a single unbroken line."
            exit 1
          fi

          case "$trimmed" in
            *[![:print:]]*)
              echo "::error::OPENAI_API_KEY contains non-printable characters."
              exit 1
              ;;
          esac

          echo "Model key present and well formed ($raw_len characters)."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            autorecorder/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend
        working-directory: backend
        run: uv sync --locked

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install recorder
        working-directory: autorecorder
        run: npm ci

      - name: Install Chromium
        working-directory: autorecorder
        run: npx playwright install --with-deps chromium

      # Muxes the two narration tracks onto Shared State and Threads. A missing
      # ffmpeg is a skip rather than a failure in mux.mjs, but the clips are
      # better with it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Start the AG2 backend
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p ../autorecorder/videos/logs
          nohup uv run python main.py > ../autorecorder/videos/logs/backend.log 2>&1 &
          echo "started"

      - name: Start the Copilot Runtime and Angular
        working-directory: frontend
        run: |
          mkdir -p ../autorecorder/videos/logs
          nohup npm run runtime > ../autorecorder/videos/logs/runtime.log 2>&1 &
          nohup npm start > ../autorecorder/videos/logs/frontend.log 2>&1 &
          echo "started"

      # All three, in dependency order, before anything is recorded. The
      # recorder has its own preflight, but failing here names which process
      # never came up — and prints its log, which is the thing you actually need.
      - name: Wait for all three processes
        run: |
          wait_for() {
            local name="$1" url="$2" tries=90
            echo "waiting for $name at $url"
            for i in $(seq 1 $tries); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ]; then
                echo "  $name up after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "::error::$name never became ready at $url"
            return 1
          }

          ok=0
          wait_for "AG2 backend"    "$BACKEND_URL/health"  || ok=1
          wait_for "Copilot Runtime" "$RUNTIME_URL"        || ok=1
          wait_for "Angular"         "$FRONTEND_URL/"      || ok=1

          if [ "$ok" != "0" ]; then
            for f in autorecorder/videos/logs/*.log; do
              echo "----- $f"
              tail -50 "$f" || true
            done
            exit 1
          fi

          echo "Registered agents:"
          curl -s "$RUNTIME_URL" | head -c 600; echo

      - name: Doctor (online)
        if: inputs.online_doctor
        working-directory: autorecorder
        run: npm run doctor:online

      # headless: false in core/engine.ts — the recorder films a real window and
      # draws its own cursor, taskbar and Notepad over it, so a virtual display
      # is not optional here.
      - name: Record
        working-directory: autorecorder
        env:
          PAGES: ${{ inputs.pages }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${PAGES:-}" ]; then
            for id in $(echo "$PAGES" | tr ',' ' '); do
              ARGS="$ARGS --page=$id"
            done
          fi
          echo "record args: ${ARGS:-<all pages>}"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npx tsx cli.ts $ARGS

      - name: Mux the narration tracks
        if: always()
        working-directory: autorecorder
        run: npm run mux

      # Rewrites manifest.json / MANIFEST.md against what was just captured, so
      # the artifact carries its own provenance: when each clip was made, what
      # it hashes to, and whether the code it shows has moved since.
      - name: Write the recording manifest
        if: always()
        working-directory: autorecorder
        run: npm run manifest

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Recording run'
            echo
            if [ -f autorecorder/videos/MANIFEST.md ]; then
              sed -n '/^| #/,/^$/p' autorecorder/videos/MANIFEST.md
            else
              echo 'No manifest produced — the run did not reach that step.'
            fi
            echo
            echo 'Eight of these eleven clips are recorded to demonstrate a defect and'
            echo 'write the finding on screen. A green run means each clip captured what'
            echo 'it was meant to — not that every feature works. See readme.md.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag2-angular-recordings
          path: |
            autorecorder/videos/*.webm
            autorecorder/videos/MANIFEST.md
            autorecorder/videos/manifest.json
            autorecorder/videos/logs/*.log
          if-no-files-found: warn
          retention-days: 14
